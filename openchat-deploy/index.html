<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenChat</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">◉ OpenChat</div><button>＋ New chat</button><nav><button>⌕ Search chats</button><button>◫ Public chat</button></nav><div class="spacer"></div><div class="profile"><div class="avatar" id="sideAvatar">?</div><div><strong id="sideName">Guest</strong><small>No account needed</small></div></div></aside><main><header><div><h1>Public Chat</h1><p>Anyone opening this site can read and reply</p></div><div><button id="notifyBtn" type="button">🔔 Enable notifications</button> <button id="changeName" type="button">Change name</button></div></header><section id="messages" class="messages"></section><div class="composer-wrap"><form id="form" class="composer"><textarea id="message" maxlength="1000" rows="1" placeholder="Message OpenChat..." required></textarea><div class="bottom"><span id="status">Messages are saved for everyone.</span><button class="send" type="submit">↑</button></div></form><p class="footnote">No password or sign-up. Your username is only a display name.</p></div></main></div><div class="modal" id="nameModal"><form class="card" id="nameForm"><div class="logo">◉</div><h2>Choose a username</h2><p>This name will appear beside the messages you send.</p><input id="username" maxlength="30" autocomplete="nickname" placeholder="Enter a username" required><button type="submit">Enter public chat</button></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
